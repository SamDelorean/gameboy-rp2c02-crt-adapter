name: Hybrid emulator CI

on:
  push:
    paths:
      - 'emulator/**'
      - '.github/workflows/emulator-ci.yml'
  pull_request:
    paths:
      - 'emulator/**'
      - '.github/workflows/emulator-ci.yml'

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure dependency-free emulator
        run: cmake -S emulator -B build/emulator -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/emulator --parallel

      - name: Run regression tests
        run: ctest --test-dir build/emulator --output-on-failure

      - name: Exercise synchronized DMG clock path
        run: |
          ./build/emulator/gbcrt_emu \
            --source-model dmg \
            --clock sync \
            --frames 1000 \
            --out build/emulator/comparison-sync.ppm

      - name: Exercise stock DMG drift path
        run: |
          ./build/emulator/gbcrt_emu \
            --source-model dmg \
            --clock stock \
            --frames 1000 \
            --out build/emulator/comparison-stock-dmg.ppm

      - name: Exercise externally-clocked SGB stock path
        run: |
          ./build/emulator/gbcrt_emu \
            --source-model sgb \
            --clock stock \
            --frames 1000 \
            --out build/emulator/comparison-stock-sgb.ppm

  sdl-viewer-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev pkg-config

      - name: Configure SDL2 viewer
        run: |
          cmake -S emulator -B build/emulator-sdl \
            -DCMAKE_BUILD_TYPE=Release \
            -DGBCRT_ENABLE_SDL2=ON

      - name: Build SDL2 viewer
        run: cmake --build build/emulator-sdl --parallel

      - name: Run core tests in SDL build
        run: ctest --test-dir build/emulator-sdl --output-on-failure

  sameboy-link-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned SameBoy library
        run: sh ./emulator/scripts/bootstrap_sameboy.sh

      - name: Configure SameBoy-backed emulator
        run: |
          cmake -S emulator -B build/emulator-sameboy \
            -DCMAKE_BUILD_TYPE=Release \
            -DGBCRT_ENABLE_SAMEBOY=ON \
            -DSAMEBOY_ROOT="$GITHUB_WORKSPACE/emulator/third_party/SameBoy"

      - name: Build SameBoy-backed emulator
        run: cmake --build build/emulator-sameboy --parallel

      - name: Run core tests in SameBoy build
        run: ctest --test-dir build/emulator-sameboy --output-on-failure

      - name: Generate project-authored smoke ROM
        run: python3 emulator/tests/generate_smoke_rom.py build/emulator-smoke

      - name: Execute smoke ROM through SameBoy DMG and alternate video path
        run: |
          ./build/emulator-sameboy/gbcrt_emu \
            --source-model dmg \
            --rom build/emulator-smoke/gbcrt_smoke.gb \
            --boot build/emulator-smoke/gbcrt_boot_stub.bin \
            --clock sync \
            --frames 12 \
            --out build/emulator-sameboy/smoke-dmg.ppm \
            | tee build/emulator-sameboy/smoke-dmg.log
          grep -q 'source: SameBoy DMG, model: DMG' build/emulator-sameboy/smoke-dmg.log
          grep -q 'SGB valid=0 sequence=0' build/emulator-sameboy/smoke-dmg.log
          python3 emulator/tests/validate_smoke_ppm.py \
            build/emulator-sameboy/smoke-dmg.ppm

      - name: Execute smoke ROM through SameBoy SGB HLE and alternate video path
        run: |
          ./build/emulator-sameboy/gbcrt_emu \
            --source-model sgb \
            --rom build/emulator-smoke/gbcrt_smoke.gb \
            --boot build/emulator-smoke/gbcrt_boot_stub.bin \
            --clock sync \
            --frames 12 \
            --out build/emulator-sameboy/smoke-sgb.ppm \
            | tee build/emulator-sameboy/smoke-sgb.log
          grep -q 'source: SameBoy SGB, model: SGB' build/emulator-sameboy/smoke-sgb.log
          grep -q 'palette: AUTO/SGB; SGB valid=1' build/emulator-sameboy/smoke-sgb.log
          python3 emulator/tests/validate_smoke_ppm.py \
            build/emulator-sameboy/smoke-sgb.ppm

      - name: Compare fallback and automatic SGB palette outputs
        run: |
          python3 emulator/tests/validate_sgb_auto_palette.py \
            build/emulator-sameboy/smoke-dmg.ppm \
            build/emulator-sameboy/smoke-sgb.ppm
